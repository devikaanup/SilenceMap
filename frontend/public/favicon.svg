<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cozy Dark Espresso Rounded Background Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#241B13" stroke="#E2D2C0" stroke-width="2"/>
  
  <!-- Open Book: Left Page Stack -->
  <path d="M12,46 C20,44 26,45 32,48 C32,32 32,24 32,24 C26,21 19,20 12,22 Z" fill="#FFFDF8" stroke="#4A3B32" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Open Book: Right Page Stack -->
  <path d="M52,46 C44,44 38,45 32,48 C32,32 32,24 32,24 C38,21 45,20 52,22 Z" fill="#FFF8EE" stroke="#4A3B32" stroke-width="1.8" stroke-linejoin="round"/>
  
  <!-- Book Cover Base (Terracotta & Dark Ink) -->
  <path d="M11,48 C20,46 26,47 32,50 C38,47 44,46 53,48" fill="none" stroke="#E07A5F" stroke-width="3" stroke-linecap="round"/>
  <path d="M11,48 C20,46 26,47 32,50 C38,47 44,46 53,48" fill="none" stroke="#4A3B32" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Amber Bookmark Ribbon hanging from spine -->
  <path d="M32,48 L32,54 L34.5,52 L37,54 L37,47" fill="#F59E0B" stroke="#4A3B32" stroke-width="1"/>

  <!-- Page Text Lines (Subtle Doodles) -->
  <path d="M16,28 C20,27 24,28 28,29" stroke="#A69588" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M16,33 C20,32 24,33 28,34" stroke="#A69588" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M16,38 C20,37 24,38 28,39" stroke="#A69588" stroke-width="1.2" stroke-linecap="round"/>

  <path d="M48,28 C44,27 40,28 36,29" stroke="#A69588" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M48,33 C44,32 40,33 36,34" stroke="#A69588" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M48,38 C44,37 40,38 36,39" stroke="#A69588" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Botanical Sprout Growing from Center Spine -->
  <path d="M32,26 Q32,15 32,12" stroke="#658B6F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Leaf -->
  <path d="M32,20 C27,19 25,14 26,11 C29,11 31,16 32,18 Z" fill="#78A083" stroke="#4A3B32" stroke-width="1.2"/>
  <!-- Right Leaf -->
  <path d="M32,17 C37,16 39,11 38,8 C35,8 33,13 32,15 Z" fill="#78A083" stroke="#4A3B32" stroke-width="1.2"/>

  <!-- Blooming Flower at the Top of the Sprout -->
  <g transform="translate(32, 11)">
    <!-- 5 Petals in Warm Amber & Coral -->
    <ellipse cx="0" cy="-6" rx="3.2" ry="4.5" fill="#F59E0B" stroke="#4A3B32" stroke-width="1.2"/>
    <ellipse cx="5.7" cy="-1.8" rx="3.2" ry="4.5" fill="#F59E0B" stroke="#4A3B32" stroke-width="1.2" transform="rotate(72 5.7 -1.8)"/>
    <ellipse cx="3.5" cy="4.8" rx="3.2" ry="4.5" fill="#F59E0B" stroke="#4A3B32" stroke-width="1.2" transform="rotate(144 3.5 4.8)"/>
    <ellipse cx="-3.5" cy="4.8" rx="3.2" ry="4.5" fill="#F59E0B" stroke="#4A3B32" stroke-width="1.2" transform="rotate(216 -3.5 4.8)"/>
    <ellipse cx="-5.7" cy="-1.8" rx="3.2" ry="4.5" fill="#F59E0B" stroke="#4A3B32" stroke-width="1.2" transform="rotate(288 -5.7 -1.8)"/>
    <!-- Flower Center Core -->
    <circle cx="0" cy="0" r="3.6" fill="#FFFDF8" stroke="#4A3B32" stroke-width="1.3"/>
    <circle cx="0" cy="0" r="1.6" fill="#D97706"/>
  </g>

  <!-- Little Golden Sparkle -->
  <path d="M47,9 Q47,12 49,12 Q47,12 47,15 Q47,12 45,12 Q47,12 47,9 Z" fill="#FDE047"/>
</svg>
